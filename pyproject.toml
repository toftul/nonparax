[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nonparax"
version = "0.1.0"
description = "Exact electromagnetic fields of non-paraxial Gaussian beams"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ivan Toftul" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9"]
keywords = ["optics", "gaussian beam", "non-paraxial", "focusing", "electromagnetics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Repository = "https://github.com/toftul/nonparaxial-gaussian"

[dependency-groups]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/nonparax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
